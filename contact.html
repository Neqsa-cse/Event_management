<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact | Jahsn-e-Junction</title>

  <link rel="stylesheet" type="text/css" href="main.css">

</head>
<body>
<header>
  <h1>Jashn-E-Junction</h1>
  <nav aria-label="Primary navigation">
    <a href="home.html">Home</a>
    <a href="services.html">Services</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About Us</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>
<main>
  <h2>Contact Us</h2>
  <form id="contactForm" novalidate aria-label="Contact form for Jashn-E-Junction">
    <label for="name">Full Name <span aria-hidden="true" style="color:#d32f2f;">*</span></label>
    <input type="text" id="name" name="name" required aria-required="true" aria-describedby="nameError" />
    <div class="error-message" id="nameError">Please enter your name.</div>

    <label for="email">Email Address <span aria-hidden="true" style="color:#d32f2f;">*</span></label>
    <input type="email" id="email" name="email" required aria-required="true" aria-describedby="emailError" />
    <div class="error-message" id="emailError">Please enter a valid email address.</div>

    <label for="phone">Phone Number</label>
    <input type="text" id="phone" name="phone" pattern="\\d{10}" aria-describedby="phoneHelp" />
    <small id="phoneHelp" style="color:rgba(0,87,0,4); font-size:0.9rem;">Optional - 10 digit number</small>

    <label for="message">Message <span aria-hidden="true" style="color:#d32f2f;">*</span></label>
    <textarea id="message" name="message" required aria-required="true" aria-describedby="messageError"></textarea>
    <div class="error-message" id="messageError">Please enter your message.</div>

    <button type="submit" aria-label="Submit contact form">Send Message</button>
  </form>
</main>
<footer>
  &copy; 2025 Jashn-E-Junction. All rights reserved.
</footer>
<script>
  document.getElementById('contactForm').addEventListener('submit', function(event) {
    event.preventDefault();

    let formValid = true;

    // Name validation
    const nameInput = this.name;
    const nameError = document.getElementById('nameError');
    if (!nameInput.value.trim()) {
      nameError.style.display = 'block';
      formValid = false;
    } else {
      nameError.style.display = 'none';
    }

    // Email validation
    const emailInput = this.email;
    const emailError = document.getElementById('emailError');
    const emailPattern = /^[a-zA-Z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i;
    if (!emailInput.value.trim() || !emailPattern.test(emailInput.value.trim())) {
      emailError.style.display = 'block';
      formValid = false;
    } else {
      emailError.style.display = 'none';
    }

    // Phone validation (optional)
    const phoneInput = this.phone;
    if (phoneInput.value.trim() && !/^\d{10}$/.test(phoneInput.value.trim())) {
      alert("Please enter a valid 10-digit phone number or leave it blank.");
      formValid = false;
    }

    // Message validation
    const messageInput = this.message;
    const messageError = document.getElementById('messageError');
    if (!messageInput.value.trim()) {
      messageError.style.display = 'block';
      formValid = false;
    } else {
      messageError.style.display = 'none';
    }

    if (formValid) {
      // Here normally you would submit form data to a server or API
      alert('Thank you for contacting Jahsn-e-Junction. We will get back to you soon.');
      this.reset();
    }
  });
</script>
</body>
</html>
